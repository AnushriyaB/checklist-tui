<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checklist</title>
  <meta name="description" content="A checklist app for your terminal." />
  <meta property="og:title" content="Checklist" />
  <meta property="og:description" content="A checklist app for your terminal." />
  <meta property="og:url" content="https://checklist-tui.vercel.app" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --white: #ffffff;
      --text: #18181b;
      --muted: #71717a;
      --blue: #3b5bdb;
      --red: #dc2626;
      --line: color-mix(in srgb, var(--blue) 16%, transparent);
      --cell: 40px;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--blue);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: grid;
      overflow: hidden;
      background: var(--blue);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    .cell {
      border-right: 1px solid color-mix(in srgb, var(--text) 4%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--text) 4%, transparent);
      border-radius: 0;
      background: var(--white);
      transition-property: border-radius;
      transition-duration: 180ms;
      transition-timing-function: var(--ease);
    }

    .cell:hover,
    .cell.on {
      border-radius: 4px;
    }

    .stage {
      position: relative;
      z-index: 2;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .row {
      width: min(32rem, calc(100% - 3rem));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      pointer-events: auto;
    }

    .sheet {
      flex-shrink: 0;
      width: 100%;
      padding: 8px 0 16px;
      background: var(--white);
      pointer-events: auto;
    }

    .mast {
      display: flex;
      align-items: center;
      height: calc(var(--cell) + 8px);
    }

    .mast .row {
      justify-content: space-between;
      gap: 0.75rem;
    }

    .cluster {
      width: min(32rem, calc(100% - 3rem));
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      white-space: nowrap;
    }

    .mark {
      margin-right: 0.28em;
    }

    .br {
      color: var(--muted);
      font-weight: 400;
    }

    .check {
      color: var(--blue);
      font-weight: 700;
      margin: 0 0.04em;
    }

    .lede {
      margin: 0;
      color: var(--muted);
      font-size: 0.8125rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .bar {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: var(--cell);
      overflow: hidden;
      border-radius: 2px;
      background: color-mix(in srgb, var(--text) 3.5%, var(--white));
    }

    .install,
    .go {
      display: flex;
      align-items: center;
      color: var(--blue);
    }

    .go {
      border: none;
      background: color-mix(in srgb, var(--blue) 9%, color-mix(in srgb, var(--text) 3.5%, var(--white)));
      text-decoration: none;
      cursor: pointer;
      border-radius: 0;
      transition-property: background;
      transition-duration: 160ms;
      transition-timing-function: var(--ease);
    }

    .go:hover {
      background: color-mix(in srgb, var(--blue) 16%, color-mix(in srgb, var(--text) 3.5%, var(--white)));
      border: none;
    }

    .go:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: -2px;
    }

    .install {
      flex: 1;
      min-width: 0;
      padding: 0.28rem 0.7rem;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.35;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .go {
      flex-shrink: 0;
      gap: 0.35em;
      padding: 0.28rem 0.7rem;
      font-weight: 600;
      font-size: 0.8125rem;
      letter-spacing: -0.01em;
      box-shadow: inset 1px 0 0 var(--line);
    }

    .go .arrow {
      display: inline-block;
      transition-property: transform;
      transition-duration: 160ms;
      transition-timing-function: var(--ease);
    }

    .go:hover .arrow { transform: translateX(4px); }
    .go:active { transform: scale(0.96); }

    .demo {
      margin-top: 0.45rem;
      width: 100%;
      height: var(--cell);
      padding: 0 0.7rem;
      display: flex;
      align-items: center;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.75rem;
      line-height: 1.35;
      color: var(--text);
      background: color-mix(in srgb, var(--text) 3.5%, var(--white));
      border-radius: 2px;
    }

    .demo .cmd { color: var(--blue); }
    .demo .arg { white-space: pre; }

    .caret {
      display: inline-block;
      width: 1.5px;
      height: 0.85em;
      margin: 0 1px -0.1em;
      background: var(--blue);
      vertical-align: -0.05em;
    }

    .caret.on {
      animation: blink 1.05s steps(1) infinite;
    }

    .by {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 0.45em;
      height: var(--cell);
      padding: 0 0.85rem;
      color: var(--muted);
      font-size: 0.8125rem;
      line-height: 1;
      white-space: nowrap;
      pointer-events: auto;
    }

    .by a {
      display: inline-flex;
      align-items: center;
      gap: 0.2em;
      color: var(--muted);
      text-decoration: none;
      transition-property: color;
      transition-duration: 160ms;
      transition-timing-function: var(--ease);
    }

    .by a:hover,
    .by a:focus-visible { color: var(--red); }
    .by a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 3px;
    }

    .flower {
      display: block;
      width: 0.85em;
      height: 0.85em;
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .cell {
        transition: none;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .in {
        animation: rise 420ms var(--ease) both;
      }
      .in-2 { animation-delay: 80ms; }
      .in-3 { animation-delay: 160ms; }
      .in-4 { animation-delay: 240ms; }
    }

    @keyframes rise {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .burst {
      position: fixed;
      z-index: 40;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      color: var(--blue);
      pointer-events: none;
      filter: drop-shadow(0 1px 1px color-mix(in srgb, var(--blue) 28%, transparent));
      animation: burst-fly 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .burst path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 28;
      stroke-dashoffset: 28;
      animation: burst-tick 240ms var(--ease) forwards;
    }

    @keyframes burst-tick {
      to { stroke-dashoffset: 0; }
    }

    @keyframes burst-fly {
      0% {
        opacity: 0;
        transform: translateY(6px) scale(0.35);
      }
      16% {
        opacity: 1;
        transform: translateY(0) scale(1.22);
      }
      28% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-72px) scale(0.88);
      }
    }
  </style>
</head>
<body>
  <div class="grid" id="grid" aria-hidden="true"></div>
  <div class="stage">
    <div class="sheet">
      <div class="mast in">
        <div class="row">
          <h1><span class="mark" aria-hidden="true"><span class="br">[</span><span class="check">✓</span><span class="br">]</span></span>Checklist</h1>
          <p class="lede">A checklist app for your terminal.</p>
        </div>
      </div>
      <div class="cluster">
        <div class="bar in in-3">
          <span class="install">npm install -g checklist-tui</span>
          <a class="go" href="https://github.com/AnushriyaB/checklist-tui" target="_blank" rel="noopener noreferrer">Github <span class="arrow" aria-hidden="true">→</span></a>
        </div>
        <p class="demo in in-3" aria-live="polite">
          <span class="cmd">checklist</span><span class="arg"> "<span id="typed"></span><span class="caret" id="caret" aria-hidden="true"></span>"</span>
        </p>
      </div>
    </div>
    <p class="by in in-4">
      Built by <a href="https://anushriya.com" target="_blank" rel="noopener noreferrer">
      <svg class="flower" viewBox="-0.4 -0.2 10.8 10.4" aria-hidden="true">

      </svg>
      Anushriya
    </a>
    </p>
  </div>
  <script>
    const notes = [
      'SF in 48 hours',
      'design a dark mode',
      'keep my succulents alive',
      'case study this sprint',
      'start a sourdough',
      '12-person Friendsgiving',
    ]
    const typed = document.getElementById('typed')
    const caret = document.getElementById('caret')
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

    async function typeNote(note) {
      caret.classList.remove('on')
      for (const char of note) {
        typed.textContent += char
        await wait(48)
      }
      caret.classList.add('on')
      await wait(4000)
      caret.classList.remove('on')
      while (typed.textContent) {
        typed.textContent = typed.textContent.slice(0, -1)
        await wait(22)
      }
    }

    async function loop() {
      let i = 0
      while (true) {
        await typeNote(notes[i % notes.length])
        i += 1
      }
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      typed.textContent = notes[0]
      caret.classList.add('on')
    } else {
      loop()
    }

    const CELL = 40
    const grid = document.getElementById('grid')

    function paintGrid() {
      const cols = Math.ceil(window.innerWidth / CELL) + 1
      const rows = Math.ceil(window.innerHeight / CELL) + 1
      const n = cols * rows
      grid.style.gridTemplateColumns = `repeat(${cols}, ${CELL}px)`
      grid.style.gridTemplateRows = `repeat(${rows}, ${CELL}px)`
      while (grid.childElementCount < n) {
        const cell = document.createElement('span')
        cell.className = 'cell'
        grid.append(cell)
      }
      while (grid.childElementCount > n) grid.lastElementChild.remove()
    }

    function placeOnGrid() {
      const h = window.innerHeight
      const stage = document.querySelector('.stage')
      stage.style.height = `${h}px`
      const total = Math.floor(h / CELL)
      const start = Math.max(1, Math.floor((total - 6) / 2))
      stage.style.paddingTop = `${start * CELL}px`
    }

    paintGrid()
    placeOnGrid()
    window.addEventListener('resize', () => {
      paintGrid()
      placeOnGrid()
    })

    function spawnCheck(x, y) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
      const mark = document.createElement('span')
      mark.className = 'burst'
      mark.setAttribute('aria-hidden', 'true')
      mark.style.left = x + 'px'
      mark.style.top = y + 'px'
      mark.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l5 5 9-11"/></svg>'
      document.body.append(mark)
      mark.addEventListener('animationend', (e) => {
        if (e.animationName === 'burst-fly') mark.remove()
      })
    }

    function overContent(x, y) {
      const el = document.elementFromPoint(x, y)
      return Boolean(el && el.closest('.sheet, .by, a'))
    }

    function cellAt(x, y) {
      if (overContent(x, y)) return null
      const col = Math.floor(x / CELL)
      const row = Math.floor(y / CELL)
      if (col < 0 || row < 0) return null
      const cols = Math.ceil(window.innerWidth / CELL) + 1
      return grid.children[row * cols + col] || null
    }

    function stamp(cell) {
      if (!cell || cell.dataset.hit) return
      cell.dataset.hit = '1'
      cell.classList.add('on')
      const box = cell.getBoundingClientRect()
      spawnCheck(box.left + box.width / 2, box.top + box.height / 2)
    }

    function stampLine(x0, y0, x1, y1) {
      const dist = Math.hypot(x1 - x0, y1 - y0)
      const steps = Math.max(1, Math.ceil(dist / (CELL / 2)))
      for (let i = 0; i <= steps; i++) {
        const t = i / steps
        stamp(cellAt(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t))
      }
    }

    let drawing = false
    let lastX = 0
    let lastY = 0

    function stopDraw(event) {
      if (!drawing) return
      drawing = false
      grid.releasePointerCapture?.(event.pointerId)
      for (const cell of grid.querySelectorAll('.cell[data-hit]')) delete cell.dataset.hit
    }

    grid.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return
      event.preventDefault()
      drawing = true
      lastX = event.clientX
      lastY = event.clientY
      grid.setPointerCapture(event.pointerId)
      stamp(cellAt(lastX, lastY))
    })

    grid.addEventListener('pointermove', (event) => {
      if (!drawing) return
      stampLine(lastX, lastY, event.clientX, event.clientY)
      lastX = event.clientX
      lastY = event.clientY
    })

    grid.addEventListener('pointerup', stopDraw)
    grid.addEventListener('pointercancel', stopDraw)
  </script>
</body>
</html>
